name: CI

on:
  push:
    branches: [main]
  pull_request:

# @smallmodelstudio/schematics is installed from GitHub Packages, which requires
# auth even for a public package. Add a repo secret named GH_PACKAGES_TOKEN
# (a PAT with read:packages) in this repo's settings before running CI.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@smallmodelstudio'
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
      - run: npm run lint
      - run: npm run build
      - run: npm test
